<meta charset="utf-8">
<title>Daksha's Learning Garden</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a bright school-bag of subjects — week chips, subject tabs, then Learn → Practise → More for the chosen subject; activities open in one big play card. Single daytime look by choice. */
:root{
  --sky:#e3f3ff; --ink:#23344d; --soft:#5b6f8c; --card:#ffffff; --line:#d3deeb; --key:#f4f8fc;
  --sun:#ffc93c; --sundark:#d99a00; --good:#2fa866; --bad:#e5484d;
  --english:#ff6f61; --maths:#3b82d6; --science:#2fa866; --gp:#f08a24; --msc:#9b6bdc;
  --blue:#3b82d6; --bluelite:#cfe3fb;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --read:"Andika","Comic Sans MS","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--sky);color:var(--ink)}
body{font-family:var(--read);font-size:17px;padding-inline:16px;padding-block:18px 40px;line-height:1.45}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--sundark);outline-offset:2px}
.app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,4vw,2.2rem);margin:0;line-height:1.1;text-wrap:balance}
h1 em{font-style:normal;color:var(--good)}
.stars{font-family:var(--display);font-size:1.35rem;font-weight:600;background:var(--card);border-radius:999px;padding:6px 16px;box-shadow:0 3px 0 var(--line);font-variant-numeric:tabular-nums}
.weeks,.subjects{display:flex;gap:10px;flex-wrap:wrap}
.weeks button{font-family:var(--display);font-weight:600;font-size:1rem;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 16px;cursor:pointer}
.weeks button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.subjects button{--c:var(--soft);font-family:var(--display);font-weight:700;font-size:1.08rem;border:none;border-radius:18px;padding:10px 16px;background:var(--card);cursor:pointer;box-shadow:0 4px 0 var(--line);display:flex;align-items:center;gap:8px}
.subjects button[aria-pressed="true"]{background:var(--c);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,black)}
.subjects .ico{font-size:1.3rem}
.s-english{--c:var(--english)} .s-maths{--c:var(--maths)} .s-science{--c:var(--science)} .s-gp{--c:var(--gp)} .s-msc{--c:var(--msc)}

.topic{background:var(--card);border-radius:24px;padding:20px 22px;box-shadow:0 5px 0 var(--line);border-top:8px solid var(--c);display:flex;flex-direction:column;gap:6px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.topic h2{font-family:var(--display);font-size:clamp(1.5rem,4vw,2rem);margin:0;line-height:1.15;text-wrap:balance}
.topic p{margin:0;color:var(--soft);max-width:62ch}
.section-h{font-family:var(--display);font-size:1.3rem;margin:6px 0 0;display:flex;align-items:baseline;gap:10px}
.section-h small{font-family:var(--read);font-size:.9rem;color:var(--soft);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.act{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;min-height:76px;box-shadow:0 3px 0 var(--line)}
.act:hover{border-color:var(--c)}
.act .aico{font-size:1.8rem;line-height:1;flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,white)}
.act .atxt{display:flex;flex-direction:column;min-width:0}
.act b{font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.2}
.act small{color:var(--soft);font-size:.85rem}
.act .tick{margin-left:auto;font-size:1.3rem;flex:none}
.learnbtn{display:flex;align-items:center;gap:16px;text-align:left;background:var(--c);color:#fff;border:none;border-radius:22px;padding:16px 20px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 70%,black)}
.learnbtn .aico{font-size:2.4rem}
.learnbtn b{font-family:var(--display);font-size:1.35rem;display:block}
.learnbtn small{opacity:.92}
.learnbtn .tick{margin-left:auto;font-size:1.5rem}
.empty{background:var(--card);border-radius:20px;padding:24px;text-align:center;color:var(--soft);border:2px dashed var(--line)}
.empty b{display:block;font-family:var(--display);color:var(--ink);font-size:1.2rem}
footer{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;color:var(--soft);font-size:.95rem;margin-top:8px}
footer a{color:var(--maths);font-weight:700}

/* player */
.player{background:var(--card);border-radius:28px;box-shadow:0 6px 0 var(--line);border-top:8px solid var(--c);padding:16px 18px 26px;display:flex;flex-direction:column;gap:14px;min-height:420px}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back{font-family:var(--display);font-weight:600;border:2px solid var(--line);background:var(--key);border-radius:14px;padding:6px 14px;cursor:pointer}
.ptitle{font-family:var(--display);font-weight:700;font-size:1.3rem;margin:0;flex:1;min-width:0}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--c)} .dots i.now{background:var(--sun);box-shadow:0 0 0 2px var(--sundark)}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;min-width:0}
.hint{font-family:var(--display);font-size:1.15rem;color:var(--soft);min-height:1.5em;margin:0;text-align:center}
.hint.good{color:var(--good)} .hint.bad{color:var(--bad)}
.q{font-family:var(--display);font-weight:600;font-size:clamp(1.25rem,3.6vw,1.7rem);margin:0;text-wrap:balance;max-width:34ch}
.sub{color:var(--soft);margin:0}
.go,.soft,.hear{font-family:var(--display);font-weight:700;font-size:1.15rem;border:none;border-radius:16px;padding:10px 22px;cursor:pointer}
.go{background:var(--good);color:#fff;box-shadow:0 4px 0 #1f7a49}
.go:disabled{opacity:.5;cursor:default}
.soft,.hear{background:var(--key);border:2px solid var(--line);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.pic{display:inline-grid;place-items:center;line-height:1}
.pic.emo{font-size:2.6rem}
.pic svg{width:64px;height:64px}
.pic.sm.emo{font-size:1.7rem} .pic.sm svg{width:38px;height:38px}
.pic.lg.emo{font-size:3.6rem} .pic.lg svg{width:96px;height:96px}
.oops{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:none;opacity:1}}

/* learn */
.lcard{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:14px}
.lcard h3{font-family:var(--display);font-size:clamp(1.4rem,4vw,1.9rem);margin:0;color:var(--c);text-wrap:balance}
.lcard .ltext{font-size:1.2rem;margin:0;max-width:52ch}
.lpics{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.lpic{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px}
.lpic figcaption{font-size:.95rem;color:var(--soft)}
.lbig{font-family:var(--display);font-weight:700;font-size:clamp(1.3rem,4.4vw,2rem);margin:0;background:#fff7dc;border:3px dashed var(--sun);border-radius:18px;padding:10px 18px;text-wrap:balance;max-width:100%}
.lextra{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0;color:var(--soft)}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;width:100%}
.cmpcol{border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cmpcol h4{font-family:var(--display);margin:0;font-size:1.15rem}
.cmpcol ul{margin:0;padding:0;list-style:none}
.lnav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* options and chips */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%;max-width:640px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:72px;border:3px solid var(--line);background:var(--key);border-radius:18px;padding:12px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.15rem;box-shadow:0 3px 0 var(--line)}
.opt.right{background:#dcf5e6;border-color:var(--good)}
.opt.nope{opacity:.45}
.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--key);border-radius:14px;padding:8px 14px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.05rem;box-shadow:0 3px 0 var(--line)}
.dz{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab}
.ghost{position:fixed;z-index:60;pointer-events:none;margin:0;opacity:.95;box-shadow:0 12px 24px rgba(35,52,77,.25)!important;transition:none}
.dragging{opacity:.3}
.over{outline:4px solid var(--sundark);outline-offset:2px;background-color:#fff7dc}
.rg.over{outline:none;stroke:var(--sundark);stroke-width:5}
.namechip{font-size:1.2rem;background:#fff1c2;border-color:var(--sundark)}
.chip.sel{background:#fff1c2;border-color:var(--sundark);transform:translateY(-3px)}
.chip.used{opacity:.35}
.chip.letter{font-family:var(--read);font-size:2rem;min-width:62px;justify-content:center;padding:4px 14px}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sentence{line-height:1.8}
.gap{display:inline-block;min-width:5ch;border-bottom:4px solid var(--sundark);color:var(--sundark);padding:0 6px}
.gap.filled{color:var(--good);border-color:var(--good)}
.answer{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;font-family:var(--display);font-size:1.2rem}
.ans{font-family:var(--display);font-size:1.6rem;font-weight:600;width:min(15ch,70vw);text-align:center;border:3px solid var(--line);border-radius:14px;padding:6px 10px;background:#fff;color:var(--ink)}
.ans.num{width:4.2ch}
.ans.ok{border-color:var(--good);color:var(--good)}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;width:100%;max-width:620px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.mcard{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;border:3px solid var(--line);background:var(--key);border-radius:16px;padding:8px 10px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.05rem;box-shadow:0 3px 0 var(--line)}
.mcard.sel{background:#fff1c2;border-color:var(--sundark)}
.mcard.done{background:var(--m);border-color:var(--m);color:#fff;cursor:default}
.m0{--m:#3b82d6}.m1{--m:#2fa866}.m2{--m:#f08a24}.m3{--m:#9b6bdc}.m4{--m:#e5484d}.m5{--m:#0f9aa8}

/* sort / order */
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:52px;width:100%}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%}
.bin{border:3px dashed var(--line);border-radius:20px;padding:12px;min-height:120px;cursor:pointer;display:flex;flex-direction:column;gap:10px;align-items:center;background:#fbfdff}
.bin:hover{border-color:var(--c)}
.binh{font-family:var(--display);font-weight:700;font-size:1.1rem}
.binitems{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.binitems .chip{pointer-events:none;cursor:default;box-shadow:none;background:#fff;border-color:var(--good)}
.slots{display:flex;flex-direction:column;gap:8px;width:100%;max-width:380px}
.slot{display:flex;align-items:center;gap:12px;border:2px dashed var(--line);border-radius:14px;padding:8px 12px;min-height:50px;font-family:var(--display);font-weight:600;font-size:1.1rem}
.slot b{width:30px;height:30px;border-radius:50%;background:var(--key);display:grid;place-items:center;flex:none}
.slot.filled{border-style:solid;border-color:var(--good);background:#effaf3}

/* clues */
.clues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px;text-align:left}
.clues li{background:#f4f8fc;border-radius:14px;padding:8px 14px;font-size:1.12rem}
.clues li.fresh{animation:pop .4s ease-out;background:#fff7dc}

/* build */
.built{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-family:var(--display);font-size:1.7rem;font-weight:700;min-height:62px}
.piece{min-width:2.4ch;min-height:52px;border:3px dashed var(--line);border-radius:12px;padding:2px 10px;display:inline-grid;place-items:center}
.piece.in{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,white)}
.plus{color:var(--soft)}
.eq{color:var(--good)}
.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{font-family:var(--display);font-weight:700;font-size:1.5rem;border:3px solid var(--line);background:var(--key);border-radius:14px;padding:6px 18px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tile:disabled{opacity:.3;cursor:default}
.meaning{font-family:var(--display);color:var(--soft);font-size:1.1rem;margin:0}

/* blocks */
.blocks{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;justify-content:center}
.rods{display:flex;gap:5px;align-items:flex-end;flex-wrap:wrap;max-width:260px;justify-content:center}
.rod{width:16px;height:120px;border-radius:4px;background:repeating-linear-gradient(to bottom,var(--blue) 0 10px,var(--bluelite) 10px 12px)}
.ones{display:grid;grid-template-columns:repeat(5,16px);gap:4px;align-content:end}
.one{width:16px;height:16px;border-radius:3px;background:var(--blue)}
.bcap{font-family:var(--display);color:var(--soft);font-size:1.05rem;margin:0}
.bigN{font-family:var(--display);font-weight:700;font-size:3.4rem;margin:0;color:var(--blue);line-height:1}

/* commas */
.commas{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;gap:0;line-height:2.2;max-width:36ch}
.commas .w{padding:0 2px}
.cgap{width:22px;height:34px;border:none;background:none;cursor:pointer;position:relative;padding:0;font-family:var(--display);font-size:1.7rem;font-weight:700;color:var(--english);vertical-align:baseline}
.cgap::after{content:"";position:absolute;left:50%;bottom:6px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--line)}
.cgap.on::after{display:none}

/* spell */
.lboxes{display:flex;gap:8px;justify-content:center}
.lb{width:34px;height:42px;border-bottom:4px solid var(--line)}
.look{font-family:var(--read);font-size:2.4rem;font-weight:700;letter-spacing:.12em;margin:0;min-height:1.3em;color:var(--maths)}

/* map */
.mapwrap{width:100%;max-width:720px;overflow-x:auto}
.mapwrap svg{width:100%;min-width:320px;height:auto;display:block}
.sea{fill:#bfe3fb}
.rg{stroke:#ffffff;stroke-width:2;stroke-linejoin:round;cursor:pointer;transition:opacity .2s}
.rg.namerica{fill:#7cc96b}.rg.samerica{fill:#ffaa45}.rg.europe{fill:#ff8fb3}.rg.africa{fill:#f2cf3c}.rg.asia{fill:#ad8ff0}.rg.australia{fill:#3fbcb2}.rg.antarctica{fill:#ffffff;stroke:#9cc5e3}
.dim .rg:not(.hl){opacity:.35}
.rg.found{stroke:#23344d;stroke-width:3}
.mlbl{font:700 15px var(--display);fill:#23344d;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:4px}
.olbl{font:600 12px var(--display);fill:#4a7aa6;text-anchor:middle;font-style:italic}
.uae{fill:#e5484d;stroke:#fff;stroke-width:1.5}
.uaelbl{font:700 12px var(--display);fill:#e5484d;paint-order:stroke;stroke:#fff;stroke-width:3px}

/* story */
.story{max-width:60ch;text-align:left;font-size:1.25rem;line-height:1.9}
.story p{margin:0 0 10px}
.tw{cursor:pointer;border-radius:6px;padding:1px 2px}
.tw:hover{background:#f0f6fc}
.tw.hit{background:var(--sun);font-weight:700}
.tw.miss{background:#ffe0e0}
.stitle{font-family:var(--display);margin:0;font-size:1.5rem;color:var(--c)}
.count{font-family:var(--display);background:var(--key);border-radius:999px;padding:2px 12px;font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
details.intro{width:100%;max-width:620px;text-align:left;background:#f4f8fc;border-radius:16px;padding:8px 14px}
details.intro summary{font-family:var(--display);font-weight:600;cursor:pointer}

/* off-screen card */
.offcard{max-width:560px;display:flex;flex-direction:column;align-items:center;gap:12px}
.bigico{font-size:4rem;line-height:1}
.offcard ul{text-align:left;margin:0;font-size:1.12rem}
.example{background:#fff7dc;border-radius:14px;padding:10px 14px;margin:0;text-align:left}

/* celebrate */
.yay{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0}
.yay .bigstar{font-size:5rem;line-height:1;animation:pop .6s ease-out}
.yay h3{font-family:var(--display);font-size:2rem;margin:0;color:var(--good)}
@media (max-width:520px){.match{gap:10px 12px}.mcard{font-size:.95rem}.rod{height:96px;width:13px}}
@media (prefers-reduced-motion:reduce){.oops,.pop,.clues li.fresh,.yay .bigstar{animation:none}}
</style>

<div class="app" id="app">
  <header class="top">
    <h1 id="brand">Daksha's <em>Learning</em> Garden</h1>
    <div class="stars" aria-live="polite">⭐ <span id="stars">0</span></div>
  </header>
  <nav class="weeks" id="weeks" aria-label="Choose a week"></nav>
  <nav class="subjects" id="subjects" aria-label="Choose a subject"></nav>
  <main id="main"><div class="empty"><b>Opening the garden…</b>Getting this week's lessons ready.</div></main>
  <footer>
    <span>Want free practice?</span>
    <a href="https://claude.ai/artifact/9q6kP95S1c35LorrsXa7Ps" target="_blank" rel="noopener">⌨️ Typing and sums garden</a>
  </footer>
</div>

<script>
/* ---------- helpers ---------- */
function h(t,p,...kids){const e=document.createElement(t);p=p||{};for(const k in p){const v=p[k];if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="text")e.textContent=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v)}kids.flat(Infinity).forEach(x=>{if(x==null||x===false)return;e.append(x.nodeType?x:document.createTextNode(String(x)))});return e}
const norm=s=>String(s).toLowerCase().replace(/[‐-–—-]/g," ").replace(/[^a-z0-9 ']/g,"").replace(/\s+/g," ").trim();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const card=x=>typeof x==="string"||typeof x==="number"?{t:String(x)}:x;
let actx=null;
function beep(f,d){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type="sine";g.gain.setValueAtTime(.14,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d)}catch(e){}}
const canSpeak="speechSynthesis" in window;
function speak(text){if(!canSpeak)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const v=speechSynthesis.getVoices().find(v=>/en-GB/i.test(v.lang))||speechSynthesis.getVoices().find(v=>/^en/i.test(v.lang));if(v)u.voice=v;u.rate=.88;speechSynthesis.speak(u)}catch(e){}}
function speakBtn(text,label){return canSpeak?h("button",{class:"hear",type:"button",onclick:()=>speak(text)},label||"🔊 Read it to me"):null}
function shake(el){if(!el)return;el.classList.remove("oops");void el.offsetWidth;el.classList.add("oops")}

/* ---------- pictures ---------- */
